name: Extraer directorio Multiplaza

on:
  workflow_dispatch:
  push:
    branches: ["claude/wizardly-wright-hxjjc9"]
    paths:
      - "scripts/scrape_multiplaza.py"
      - ".github/workflows/scrape-multiplaza.yml"

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/scrape_multiplaza.py
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/multiplaza
          git commit -m "Datos del directorio Multiplaza extraídos automáticamente" || echo "sin cambios"
          git push
